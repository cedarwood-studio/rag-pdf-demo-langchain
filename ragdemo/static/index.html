<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document questions</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #2f6f4f; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 760px; padding: 16px; }
  h1 { font-size: 1.25rem; margin-bottom: 0; }
  .sub { opacity: .75; margin-top: 4px; font-size: .9rem; }
  #log { margin: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .q { align-self: flex-end; background: #8881; max-width: 85%; }
  .refused { border-color: #b36b00; }
  .cites { margin: 8px 0 0; padding-left: 18px; font-size: .88rem; white-space: normal; }
  .meta { font-size: .8rem; opacity: .7; margin-top: 6px; }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; padding: 8px 0; background: Canvas; }
  input { flex: 1; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<h1>Ask the documents</h1>
<p class="sub">Answers come only from the loaded PDFs. Every answer lists the document and page it came from. If the documents do not cover a question, the reply says so.</p>
<div id="log"></div>
<form id="form">
  <input id="question" autocomplete="off" placeholder="For example: What is a tabletop exercise?" required>
  <button id="send">Ask</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("question");
const send = document.getElementById("send");

function add(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  add("q", question);
  input.value = "";
  send.disabled = true;
  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!response.ok) throw new Error("The server returned " + response.status);
    const data = await response.json();
    const el = add(data.refused ? "a refused" : "a", data.answer);
    if (data.citations.length) {
      const list = document.createElement("ol");
      list.className = "cites";
      for (const c of data.citations) {
        const item = document.createElement("li");
        item.textContent = `${c.title} (${c.document}), page ${c.page}` + (c.heading ? `, section "${c.heading}"` : "");
        list.appendChild(item);
      }
      el.appendChild(list);
    }
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `mode: ${data.mode}, best match score ${data.top_score.toFixed(3)}, refusal threshold ${data.threshold}`;
    el.appendChild(meta);
  } catch (error) {
    add("a refused", "Request failed: " + error.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
